<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.author.name }}</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">{{ site.author.name }}</div>
            <div class="nav-links">
                <a href="#about">À propos</a>
                <a href="#experience">Expérience</a>
                <a href="#skills">Compétences</a>
                <a href="#education">Formation</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    {{ content }}

    <footer>
        <div class="container">
            <p>&copy; 2026 {{ site.author.name }}. Architect Cloud & DevOps & FullStack</p>
        </div>
    </footer>

    <script>
        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Navbar au scroll
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Filtrage des compétences par catégorie
        (function () {
            const legend = document.querySelector('.skills-legend');
            if (!legend) return;
            const chips = Array.from(legend.querySelectorAll('.chip'));
            const cells = Array.from(document.querySelectorAll('.skill-cell'));

            // Rendez les chips accessibles
            chips.forEach(chip => {
                chip.setAttribute('role', 'button');
                chip.setAttribute('tabindex', '0');
            });

            const getCategoryFromChip = (chip) => {
                // cat.chipClass est de type "chip-<id>", on tente d'en déduire l'id si besoin
                // Mais on préfère mapper via le texte
                const label = chip.textContent.trim();
                // Cherche la catégorie correspondante dans une data embarquée si disponible plus tard
                // Fallback: aucune correspondance stricte, on utilise classes: chip-domain/devops/dev
                if (chip.classList.contains('chip-domain')) return 'cloud';
                if (chip.classList.contains('chip-devops')) return 'devops';
                if (chip.classList.contains('chip-dev')) return 'dev';
                return null;
            };

            function applyFilter(activeChip) {
                const active = activeChip && activeChip.classList.contains('active');
                chips.forEach(c => c.classList.remove('active'));
                if (active) {
                    // Toggle off: montrer tout
                    cells.forEach(cell => { cell.style.display = ''; });
                    return;
                }
                activeChip.classList.add('active');
                const cat = getCategoryFromChip(activeChip);
                if (!cat) {
                    cells.forEach(cell => { cell.style.display = ''; });
                    return;
                }
                cells.forEach(cell => {
                    const cellCat = cell.getAttribute('data-category');
                    cell.style.display = (cellCat === cat) ? '' : 'none';
                });
            }

            function onChipActivate(e) {
                const chip = e.currentTarget;
                applyFilter(chip);
            }

            chips.forEach(chip => {
                chip.addEventListener('click', onChipActivate);
                chip.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        onChipActivate(e);
                    }
                });
            });
        })();
    </script>
</body>

</html>
